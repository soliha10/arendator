# Bitta VPS'da butun loyihani koʻtarish uchun.
#
#   cp .env.example .env.docker  (va qiymatlarni toʻldiring)
#   docker compose up -d --build
#   docker compose exec web npx prisma migrate deploy
#   docker compose exec web npm run db:seed     # ixtiyoriy: demo maʼlumot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arendator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-arendator}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arendator}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Bazani tashqi dunyoga ochmaymiz — faqat ichki tarmoq
    expose:
      - '5432'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arendator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arendator}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-arendator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arendator}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET kerak — openssl rand -base64 32}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    volumes:
      # STORAGE_DRIVER=local boʻlsa rasmlar shu yerda saqlanadi
      - uploads:/app/public/uploads
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  db-data:
  uploads:
